name: Scan container images with OSV-Scanner
on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: "ubuntu-latest"
      fail-on-severity:
        description: "Minimum severity to fail on: critical, high, medium, low"
        required: false
        type: string
        default: "critical"
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      GHCR_TOKEN:
        required: false
        description: "PAT with read:packages for private GHCR images"
      HARBOR_USERNAME:
        required: false
      HARBOR_PASSWORD:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ${{ inputs.runs-on }}
    container:
      image: ghcr.io/bl4ko/ci-tools:latest@sha256:83bccc89714acc255a12524350ff3cd8634b2139fc9c52eca0247b99773a42ee
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: crane auth login ghcr.io -u "$GITHUB_ACTOR" -p "$GHCR_TOKEN"

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        if: env.HARBOR_USERNAME != '' && env.HARBOR_PASSWORD != ''
        run: crane auth login harbor.xqx.uk -u "$HARBOR_USERNAME" -p "$HARBOR_PASSWORD"

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: crane auth login docker.io -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"

      - name: Extract and scan image references
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FAIL_THRESHOLD: ${{ inputs.fail-on-severity }}

        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "Not a pull request event, skipping."
            exit 0
          fi

          git config --global --add safe.directory "$PWD"

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.yml' '*.yaml')

          if [ -z "$CHANGED_FILES" ]; then
            echo "No YAML files changed."
            exit 0
          fi

          # Extract images from HEAD version of changed files
          HEAD_IMAGES=$(echo "$CHANGED_FILES" | xargs grep -hE '^\s*(image|value):\s*\S+' 2>/dev/null \
            | grep -oE '[a-zA-Z0-9._/-]+:[a-zA-Z0-9._-]+(@sha256:[a-f0-9]{64})?' \
            | grep -E '^[a-z]' \
            | grep -vE '^\s*#' \
            | grep '/' \
            | sort -u || true)

          if [ -z "$HEAD_IMAGES" ]; then
            echo "No image references found in changed files."
            exit 0
          fi

          BASE_IMAGES=$(git grep -hE '^\s*(image|value):\s*\S+' "$BASE_SHA" -- '*.yml' '*.yaml' 2>/dev/null \
            | grep -oE '[a-zA-Z0-9._/-]+:[a-zA-Z0-9._-]+' \
            | grep -E '^[a-z]' \
            | grep -vE '^\s*#' \
            | grep '/' \
            | sort -u || true)

          # Strip @sha256:... digests for comparison
          BASE_IMAGES_STRIPPED=$(echo "$BASE_IMAGES" | while IFS= read -r line; do echo "${line%%@sha256:*}"; done | sort -u)

          IMAGES=""
          for img in $HEAD_IMAGES; do
            img_stripped="${img%%@sha256:*}"
            if echo "$BASE_IMAGES_STRIPPED" | grep -qxF "$img_stripped"; then
              echo "Skipping $img (same image:tag exists on base branch)"
            else
              IMAGES+="$img"$'\n'
            fi
          done
          IMAGES=$(echo "$IMAGES" | sed '/^$/d' | sort -u)

          if [ -z "$IMAGES" ]; then
            echo "No new or changed image references to scan."
            exit 0
          fi

          echo "Found new/changed image references to scan:"
          echo "$IMAGES"
          echo "---"

          get_count() {
            local count
            count=$(echo "$2" | grep -o "[0-9]* $1" | awk '{print $1}')
            echo "${count:-0}"
          }

          cat > "$RUNNER_TEMP/osv_blocking.py" <<'PYTHON'
          import json, sys

          ORDER = {"low": 0, "medium": 1, "high": 2, "critical": 3}

          def severity(value):
              try:
                  score = float(value)
              except (TypeError, ValueError):
                  return None
              if score >= 9:
                  return "critical"
              if score >= 7:
                  return "high"
              if score >= 4:
                  return "medium"
              return "low" if score > 0 else None

          def fixable(vulnerability, ecosystem):
              return any(
                  event.get("fixed")
                  for affected in vulnerability.get("affected", [])
                  if affected.get("package", {}).get("ecosystem") == ecosystem
                  for ranges in affected.get("ranges", [])
                  for event in ranges.get("events", [])
              )

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          threshold = sys.argv[2]
          blocking = 0
          for result in data.get("results", []):
              for package in result.get("packages", []):
                  ecosystem = package.get("package", {}).get("ecosystem")
                  scores = {
                      advisory: severity(group.get("max_severity"))
                      for group in package.get("groups", [])
                      for advisory in group.get("ids", [])
                  }
                  for vulnerability in package.get("vulnerabilities", []):
                      rank = ORDER.get(scores.get(vulnerability.get("id")) or "", -1)
                      if rank >= ORDER[threshold] and fixable(vulnerability, ecosystem):
                          blocking += 1
          print(blocking)
          PYTHON

          scan_image() {
            local img="$1"
            local tarball output
            tarball=$(mktemp --suffix=.tar)
            if ! crane pull "$img" "$tarball" 2>/dev/null; then
              rm -f "$tarball"
              echo "-1"
              return
            fi
            output=$(mktemp)
            osv-scanner scan image --archive "$tarball" --format json --output-file "$output" >/dev/null 2>&1 || true
            rm -f "$tarball"
            if ! python3 -m json.tool "$output" >/dev/null 2>&1; then
              rm -f "$output"
              echo "-1"
              return
            fi
            python3 "$RUNNER_TEMP/osv_blocking.py" "$output" "$FAIL_THRESHOLD"
            rm -f "$output"
          }

          OVERALL_FAIL=0
          for img in $IMAGES; do
            echo ""
            echo "=== Scanning: $img ==="

            TARBALL=$(mktemp --suffix=.tar)
            if ! crane pull "$img" "$TARBALL" 2>&1; then
              echo "::error::Failed to pull $img from registry."
              OVERALL_FAIL=1
              rm -f "$TARBALL"
              continue
            fi

            OUTPUT_FILE=$(mktemp)
            JSON_FILE=$(mktemp)
            osv-scanner scan image --archive "$TARBALL" > "$OUTPUT_FILE" 2>&1 || true
            osv-scanner scan image --archive "$TARBALL" --format json --output-file "$JSON_FILE" >/dev/null 2>&1 || true
            cat "$OUTPUT_FILE"
            rm -f "$TARBALL"

            SUMMARY_LINE=$(grep 'Total .* packages affected by' "$OUTPUT_FILE" || true)

            if [ -z "$SUMMARY_LINE" ]; then
              echo "No vulnerabilities found for $img."
              rm -f "$OUTPUT_FILE" "$JSON_FILE"
              continue
            fi

            CRITICAL=$(get_count "Critical" "$SUMMARY_LINE")
            HIGH=$(get_count "High" "$SUMMARY_LINE")
            MEDIUM=$(get_count "Medium" "$SUMMARY_LINE")
            LOW=$(get_count "Low" "$SUMMARY_LINE")
            rm -f "$OUTPUT_FILE"

            if ! python3 -m json.tool "$JSON_FILE" >/dev/null 2>&1; then
              echo "::error::OSV scanner did not produce valid JSON for $img."
              rm -f "$JSON_FILE"
              OVERALL_FAIL=1
              continue
            fi
            BLOCKING_COUNT=$(python3 "$RUNNER_TEMP/osv_blocking.py" "$JSON_FILE" "$FAIL_THRESHOLD")
            rm -f "$JSON_FILE"

            if [ "$BLOCKING_COUNT" -eq 0 ]; then
              echo "::notice::$img has vulnerabilities (Critical=$CRITICAL High=$HIGH Medium=$MEDIUM Low=$LOW) but none are fixable — skipping."
              continue
            fi

            if [ "$BLOCKING_COUNT" -gt 0 ]; then
              # Check if this is a version bump — find the base image for the same image name
              img_name="${img%%:*}"
              BASE_IMG=$(echo "$BASE_IMAGES" | grep "^${img_name}:" | head -1 || true)

              if [ -n "$BASE_IMG" ]; then
                echo "Version bump detected: $BASE_IMG → $img"
                echo "Scanning base image for comparison..."
                BASE_BLOCKING=$(scan_image "$BASE_IMG")

                if [ "$BASE_BLOCKING" = "-1" ]; then
                  echo "::notice::Could not pull base image $BASE_IMG for comparison — treating as new image."
                elif [ "$BLOCKING_COUNT" -le "$BASE_BLOCKING" ]; then
                  echo "::notice::$img has $BLOCKING_COUNT fixable ${FAIL_THRESHOLD}+ vulnerabilities (base $BASE_IMG had $BASE_BLOCKING) — not a regression, passing."
                  continue
                else
                  echo "::warning::$img has $BLOCKING_COUNT fixable ${FAIL_THRESHOLD}+ vulnerabilities (base $BASE_IMG had $BASE_BLOCKING) — regression detected."
                fi
              fi

              echo "::warning::$img has $BLOCKING_COUNT fixable ${FAIL_THRESHOLD}+ vulnerabilities (Critical=$CRITICAL High=$HIGH Medium=$MEDIUM Low=$LOW)"
              OVERALL_FAIL=1
            fi
          done

          if [ "$OVERALL_FAIL" -eq 1 ]; then
            echo "::error::One or more images have vulnerabilities at or above $FAIL_THRESHOLD severity."
            exit 1
          fi

          echo "All images passed vulnerability scan."
