name: gitleaks
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: "ubuntu-latest"
      container-image:
        required: false
        type: string
        default: "ghcr.io/bl4ko/ci-tools:v1.19.4@sha256:66f1bc03a7c780d9ae1fc821cba56d0c22347a718ad1d96bb74670c4d1de2e3d"
jobs:
  scan:
    name: gitleaks
    runs-on: ${{ inputs.runs-on }}
    container:
      image: ${{ inputs.container-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --log-opts=HEAD
