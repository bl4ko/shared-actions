name: gitleaks
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: "ubuntu-latest"
      container-image:
        required: false
        type: string
        default: "ghcr.io/bl4ko/ci-tools:v1.19.3@sha256:f355c1fc261cb212941b5497b27175ae2ee23f960ffc87e6ed4f342fcf155ec9"
jobs:
  scan:
    name: gitleaks
    runs-on: ${{ inputs.runs-on }}
    container:
      image: ${{ inputs.container-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --log-opts=HEAD
